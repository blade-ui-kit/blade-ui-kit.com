name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: "http://127.0.0.1:7700"
      MEILISEARCH_KEY: masterKey

    services:
      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 7700:7700

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ruby and its YAML parser are included in the Ubuntu runner image.
      - name: Require pinned actions
        run: |
          ruby .github/scripts/test-pinned-actions.rb
          ruby .github/scripts/check-pinned-actions.rb

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-suggest

      - name: Run migrations
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Cache icons
        run: php artisan icons:cache

      - name: Import icon sets
        run: php artisan icons:import

      - name: Index icons
        run: |
          php artisan scout:index icons
          php artisan scout:import "App\\Models\\Icon"

      - name: Install NPM dependencies
        run: npm install

      - name: Compile assets
        run: npm run build

      - name: Execute tests
        run: vendor/bin/phpunit

  dependabot:
    needs: [tests]
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Approve and merge the pull request
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: [tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: curl "${DEPLOY_HOOK}&sha=${GITHUB_SHA}"
